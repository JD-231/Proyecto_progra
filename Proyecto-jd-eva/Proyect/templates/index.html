<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MetaJuan</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    
</head>

<body>

    <header class="header">

        <nav class="navbar">

            <h2 class="logo">ChatBot</h2>

        </nav>

    </header>

    <main>

        <!-- Hero -->

        <section class="hero">

            <div class="hero-text">

                <h1 id="bienvenida">
                    Bienvenido
                </h1>

            </div>

            <div class="hero-image">

                <img src="https://picsum.photos/500/350"
                     alt="Imagen principal">

            </div>

        </section>

        <!-- Tarjetas -->

        <section class="cards">

            <a href="/resumen" class="card">

                <h3>Resumen</h3>
                <p>Resumir textos.</p>

            </a>

            <a href="/corrector" class="card">

                <h3>Corrección</h3>
                <p>Corregir palabras u oraciones.</p>

            </a>

            <a href="/emociones" class="card">

                <h3>Emociones</h3>
                <p>Detección de emociones.</p>

            </a>

            <a href="/idioma" class="card">

                <h3>Traducción</h3>
                <p>Traductor de textos.</p>

            </a>

            <a href="/preguntas" class="card">

                <h3>Preguntas</h3>
                <p>Respuestas a sus preguntas.</p>

            </a>

        </section>

    </main>

    <footer class="footer">

        <h3>MetaJuan</h3>

    </footer>

</body>

</html>
